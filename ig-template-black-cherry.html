<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@1,300&family=DM+Mono:wght@300;400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    background: #0A0A0A;
    display: flex;
    align-items: stretch;
    justify-content: stretch;
  }

  .card {
    width: 1080px;
    height: 1080px;
    background: #0A0A0A;
    padding: 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
  }

  /* TOP */
  .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .brand {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 0.15em;
    color: #F8F6F2;
  }

  .lot-id {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: rgba(248,246,242,0.3);
    text-transform: uppercase;
    text-align: right;
    line-height: 1.6;
  }

  /* DIVIDER */
  .divider {
    width: 100%;
    height: 1px;
    background: rgba(248,246,242,0.12);
    margin: 2px 0;
  }

  /* MIDDLE */
  .middle {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 48px 0;
  }

  .process-tag {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.3em;
    color: rgba(248,246,242,0.35);
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  .lot-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 148px;
    line-height: 0.88;
    letter-spacing: 0.02em;
    color: #F8F6F2;
    margin-bottom: 40px;
  }

  .lot-name .sub {
    font-size: 72px;
    letter-spacing: 0.12em;
    color: rgba(248,246,242,0.45);
    display: block;
    margin-top: 8px;
  }

  .tasting {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 28px;
    color: rgba(248,246,242,0.65);
    letter-spacing: 0.02em;
    line-height: 1.5;
    border-left: 2px solid rgba(248,246,242,0.2);
    padding-left: 24px;
  }

  /* BOTTOM */
  .bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .producer-info {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .producer-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 0.08em;
    color: #F8F6F2;
  }

  .producer-detail {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: rgba(248,246,242,0.3);
    text-transform: uppercase;
  }

  .year {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: rgba(248,246,242,0.2);
    text-transform: uppercase;
    text-align: right;
  }

  /* Accent dot */
  .accent {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #F8F6F2;
    opacity: 0.2;
    display: inline-block;
    margin: 0 10px;
    vertical-align: middle;
  }
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-PBQKW7HJYG"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-PBQKW7HJYG');
</script>
</head>
<body>
<div class="card">

  <!-- TOP -->
  <div>
    <div class="top">
      <div class="brand">COFI TRADERS</div>
      <div class="lot-id">
        LOT #CBV-BC-ANA-2025<br>
        COSECHA 2025
      </div>
    </div>
    <div class="divider" style="margin-top:20px;"></div>
  </div>

  <!-- MIDDLE -->
  <div class="middle">
    <p class="process-tag">ANAEROBIC · H10 · 1,600 MASL</p>
    <h1 class="lot-name">
      MILENIO
      <span class="sub">BLACK CHERRY</span>
    </h1>
    <p class="tasting">Dark fruit &nbsp;·&nbsp; Hibiscus &nbsp;·&nbsp; Chocolate</p>
  </div>

  <!-- BOTTOM -->
  <div>
    <div class="divider" style="margin-bottom:20px;"></div>
    <div class="bottom">
      <div class="producer-info">
        <span class="producer-name">LICA TORRES</span>
        <span class="producer-detail">Cerro Buena Vista · Brunca, Costa Rica</span>
      </div>
      <div class="year">
        cofi.cr<br>
        2025
      </div>
    </div>
  </div>

</div>
</body>
</html>
